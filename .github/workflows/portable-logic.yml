name: Portable logic (not MQL5 compilation)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run source logic fixtures and boundary doubles
        run: python3 tools/test_portable_logic.py
      - name: Run dashboard source fixtures and chart-object doubles
        run: python3 tools/test_dashboard.py
